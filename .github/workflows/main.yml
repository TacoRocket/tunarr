name: Build

on:
  # A cache saved on main can be restored by builds for other pull requests.
  push:
    branches: [main]
    paths:
      - '.github/workflows/main.yml'
      - 'server/package.json'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**/*.png'
      - '!docs/**/*.jpg'
      - '!docs/**/*.webp'
      - '!docs/**/*.gif'
      - 'docs/generated/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source commit to validate; leave empty for the selected branch'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: fork-validation-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      TURBO_CACHE_DIR: .turbo
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Use Latest Corepack
        run: |
          npm install -g corepack@latest
          corepack enable && corepack enable pnpm
          pnpm --version

      - name: Install build toolchain
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Identify cache inputs
        id: cache-inputs
        run: |
          context="$(node -p '[process.platform, process.arch, process.version].join("-")')-${ImageOS}-${ImageVersion}"
          {
            echo "source=$(git rev-parse HEAD)"
            echo "context=$context"
            jq -r '"meilisearch=\(.meilisearch.version)",
              (.ersatztvNext | "next_repo=\(.releaseRepo)", "next_tag=\(.releaseTag)", "next_sha=\(.sha256["linux-x64"])")' server/package.json
          } >> "$GITHUB_OUTPUT"
          echo "TUNARR_TEST_CACHE_CONTEXT=$context" >> "$GITHUB_ENV"

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-v2-${{ steps.cache-inputs.outputs.context }}-${{ steps.cache-inputs.outputs.source }}
          restore-keys: |
            ${{ runner.os }}-turbo-v2-${{ steps.cache-inputs.outputs.context }}-

      - name: Check web/backend packaging version guard
        run: node --test scripts/check-web-version.test.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Check the generated OpenAPI spec and web client are current
        run: |
          pnpm turbo build --filter=@tunarr/types --filter=@tunarr/shared
          TUNARR_DATABASE_PATH="$(mktemp -d)" pnpm --filter @tunarr/server generate-openapi
          pnpm --filter @tunarr/web generate-client
          if [ -n "$(git status --porcelain -- web/src/generated docs/generated)" ]; then
            echo "::error::The committed OpenAPI spec or web client is out of date."
            echo "Run 'pnpm --filter @tunarr/server generate-openapi' and 'pnpm --filter @tunarr/web generate-client' and commit the result."
            git status --porcelain -- web/src/generated docs/generated
            git diff -- web/src/generated docs/generated | head -200
            exit 1
          fi

      - name: Build server
        run: pnpm turbo typecheck --filter=@tunarr/server

      - name: Build web
        run: pnpm turbo build --filter=@tunarr/web

      # The web storybook test project runs stories in headless Chromium.
      # The runner image already carries Chrome's system libraries, so only the
      # browser is downloaded. --with-deps also ran apt-get against Ubuntu's
      # mirrors, which stalled one release Build for 20+ minutes.
      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: pnpm --filter @tunarr/web exec playwright install chromium

      - name: Run server, web and shared tests on Node
        # Package scripts already pass --run. Extra Turbo arguments also change
        # dependency build hashes, preventing reuse of the builds above.
        run: pnpm turbo test

      - name: Cache Meilisearch for Linux x64
        id: meilisearch-cache
        uses: actions/cache@v5
        with:
          path: server/bin/meilisearch
          key: meilisearch-linux-x64-${{ steps.cache-inputs.outputs.meilisearch }}

      - name: Download Meilisearch on cache miss
        if: steps.meilisearch-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MEILI_VERSION: ${{ steps.cache-inputs.outputs.meilisearch }}
        run: |
          mkdir -p server/bin
          gh release download "v$MEILI_VERSION" --repo meilisearch/meilisearch \
            --pattern meilisearch-linux-amd64 --output server/bin/meilisearch --clobber
          chmod 755 server/bin/meilisearch

      - name: Cache the pinned Next archive for Linux x64
        id: next-cache
        uses: actions/cache@v5
        with:
          path: server/bin/ersatztv-next-${{ steps.cache-inputs.outputs.next_tag }}-linux-x64.tar.gz
          key: ersatztv-next-linux-x64-${{ steps.cache-inputs.outputs.next_sha }}

      - name: Download Next on cache miss
        if: steps.next-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_REPO: ${{ steps.cache-inputs.outputs.next_repo }}
          NEXT_TAG: ${{ steps.cache-inputs.outputs.next_tag }}
        run: |
          gh release download "$NEXT_TAG" --repo "$NEXT_REPO" \
            --pattern "ersatztv-next-$NEXT_TAG-linux-x64.tar.gz" --dir server/bin --clobber

      - name: Package the server bundle
        run: pnpm turbo package-container --filter=@tunarr/server

      - name: Start the bundle under Node with the worker pool
        run: pnpm --filter @tunarr/server test:worker-smoke --binary scripts/node-bundle-entry.sh
