name: Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**/*.png'
      - '!docs/**/*.jpg'
      - '!docs/**/*.webp'
      - '!docs/**/*.gif'
      - 'docs/generated/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source commit to validate; leave empty for the selected branch'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: fork-validation-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      TURBO_CACHE_DIR: .turbo
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Use Latest Corepack
        run: |
          npm install -g corepack@latest
          corepack enable && corepack enable pnpm
          pnpm --version

      - name: Install build toolchain
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Identify cache inputs
        id: cache-inputs
        run: |
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          context="$(node -p '[process.platform, process.arch, process.version].join("-")')-${ImageOS}-${ImageVersion}"
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "TUNARR_TEST_CACHE_CONTEXT=$context" >> "$GITHUB_ENV"

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-v2-${{ steps.cache-inputs.outputs.context }}-${{ steps.cache-inputs.outputs.source }}
          restore-keys: |
            ${{ runner.os }}-turbo-v2-${{ steps.cache-inputs.outputs.context }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the generated OpenAPI spec and web client are current
        run: |
          pnpm turbo build --filter=@tunarr/types --filter=@tunarr/shared
          TUNARR_DATABASE_PATH="$(mktemp -d)" pnpm --filter @tunarr/server generate-openapi
          pnpm --filter @tunarr/web generate-client
          if [ -n "$(git status --porcelain -- web/src/generated docs/generated)" ]; then
            echo "::error::The committed OpenAPI spec or web client is out of date."
            echo "Run 'pnpm --filter @tunarr/server generate-openapi' and 'pnpm --filter @tunarr/web generate-client' and commit the result."
            git status --porcelain -- web/src/generated docs/generated
            git diff -- web/src/generated docs/generated | head -200
            exit 1
          fi

      - name: Build server
        run: pnpm turbo typecheck --filter=@tunarr/server

      - name: Build web
        run: pnpm turbo build --filter=@tunarr/web

      # The web storybook test project runs stories in headless Chromium.
      - name: Install Playwright Chromium
        run: pnpm --filter @tunarr/web exec playwright install --with-deps chromium

      - name: Run tests
        # Package scripts already pass --run. Extra Turbo arguments also change
        # dependency build hashes, preventing reuse of the builds above.
        run: pnpm turbo run @tunarr/shared#test @tunarr/web#test @tunarr/server#test:ci

      # These measure this runner's latency and heap use. Run separately because
      # both server suites create and remove the same temporary DB template.
      - name: Run server performance checks
        run: pnpm turbo run test:perf --filter=@tunarr/server
