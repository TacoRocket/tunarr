name: tunarr-extension-trial
services:
  trial-tunarr:
    platform: linux/amd64
    build:
      context: ../../..
      dockerfile: docker/test/extensions/Dockerfile.web
    environment:
      TUNARR_BIND_ADDR: 0.0.0.0
    volumes:
      - tunarr-data:/config/tunarr
  extension-host:
    build: ./host
    environment:
      TUNARR_URL: http://trial-tunarr:8000
    volumes:
      - extension-data:/state
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    pids_limit: 64
  gateway:
    image: nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    ports:
      - "127.0.0.1:8432:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  tunarr-data:
  extension-data:
